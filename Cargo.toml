[package]
name = "git-whistles"
version = "2.0.1"
edition = "2021"
description = "A few helpers for classic Git workflows"
license = "MIT"
repository = "https://github.com/mezis/git-whistles"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.30"
tempfile = "3.10"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
